name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore or generate debug keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Sign APK with Release Key
      if: success()
      env:
        SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$SIGNING_KEY_BASE64" ]; then
          echo "Decoding release keystore from secrets..."
          echo "$SIGNING_KEY_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner: $APKSIGNER"
          
          mkdir -p app/build/outputs/apk/signed
          INPUT_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          OUTPUT_APK="app/build/outputs/apk/signed/app-release-signed.apk"
          
          ALIAS="${KEY_ALIAS:-my-key-alias}"
          STORE_PASS="$KEY_STORE_PASSWORD"
          KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
          
          echo "Signing APK: $INPUT_APK -> $OUTPUT_APK"
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out "$OUTPUT_APK" \
            "$INPUT_APK"
            
          echo "Verifying signed APK..."
          "$APKSIGNER" verify -v "$OUTPUT_APK"
          echo "Release APK successfully signed and verified!"
        else
          echo "SIGNING_KEY secret is not set. Skipping release signing."
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-apk
        path: |
          app/build/outputs/apk/signed/*.apk
          app/build/outputs/apk/debug/*.apk

